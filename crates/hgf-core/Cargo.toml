[package]
name = "hgf-core"
license = "GPL-3.0-or-later"
description = "Greaseweazle command model, process runner and output parser for HappyGreaseFloppy"
version = "0.17.1"
edition.workspace = true
rust-version.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
