[package]
name = "xcopy-modern"
license = "GPL-3.0-or-later"
description = "X-COPY Modern: retro Amiga disk copier, formatter and writer for Greaseweazle"
version = "1.0.0"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "xcopy-modern"
path = "src/main.rs"

[dependencies]
hgf-core = { path = "../hgf-core" }
eframe = { version = "0.36.2", features = ["persistence"] }
rfd = "0.15"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
font8x8 = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
